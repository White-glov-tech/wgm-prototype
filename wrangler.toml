name = "wgm-prototype"
main = "src/worker.js"
compatibility_date = "2026-09-18"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
DEMO_MODE = "false"
OPENAI_SCREENING_MODEL = "gpt-5.6-luna"
SCRIN_API_BASE_URL = "https://scrin.io"

# Keep API keys/tokens in Cloudflare secrets, never here.
# Required secrets:
# OPENAI_API_KEY
# SCRIN_TOKEN
