name = "wgm-prototype"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
DEMO_MODE = "false"
OPENAI_SCREENING_MODEL = "gpt-5.6-luna"
SCRIN_API_BASE_URL = "https://scrin.io"

# Secrets configured in Cloudflare:
# OPENAI_API_KEY
# SCRIN_TOKEN
